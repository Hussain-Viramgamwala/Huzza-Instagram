name: Publish to Instagram

on:
  schedule:
    # Every 15 minutes. GitHub may run these a few minutes late at busy times.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check the queue, don't post"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instagram-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Skip quickly when nothing is queued
        id: queue
        run: |
          if ls posts/queue/*.y*ml >/dev/null 2>&1; then echo "has_posts=true" >> "$GITHUB_OUTPUT"; else echo "Queue is empty."; fi

      - uses: actions/setup-python@v5
        if: steps.queue.outputs.has_posts == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.queue.outputs.has_posts == 'true'
        run: pip install -r requirements.txt

      - name: Publish due posts
        if: steps.queue.outputs.has_posts == 'true'
        env:
          IG_TOKEN_HUZZA: ${{ secrets.IG_TOKEN_HUZZA }}
        run: |
          git config user.name  "instagram-bot"
          git config user.email "instagram-bot@users.noreply.github.com"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/publish.py --dry-run
          else
            python scripts/publish.py
          fi
