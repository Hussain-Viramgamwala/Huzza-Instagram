name: Refresh Instagram tokens

on:
  schedule:
    # Mondays 06:13 UTC. Tokens last 60 days, so weekly keeps a wide margin.
    - cron: "13 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Refresh and save tokens
        env:
          IG_TOKEN_HUZZA: ${{ secrets.IG_TOKEN_HUZZA }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: python scripts/refresh_tokens.py
